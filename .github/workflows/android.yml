name: Android build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bootstrap standard Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x gradlew
          echo WRAPPER_BASE64_BEGIN
          base64 -w 0 gradle/wrapper/gradle-wrapper.jar
          echo
          echo WRAPPER_BASE64_END
      - name: Calculation tests, drawings, APK and lint
        run: ./gradlew :core:test :core:sampleDrawings :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace
      - name: Downloadable Android app
        uses: actions/upload-artifact@v4
        with:
          name: quote-maker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Test reports and generated sample plans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculation-and-lint-reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
            core/build/sample-drawings/
            app/build/reports/
            gradle/wrapper/gradle-wrapper.jar

  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Room, phone workflow and PDF tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            mkdir -p app/build/device-screenshots
            adb pull /sdcard/Android/data/nz.co.timbertakeoff/files/ app/build/device-screenshots/ || true
      - name: Device test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/device-screenshots/
